<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>LPS Nutrição</title>
  <meta name="description" content="Plano alimentar e avaliações - LPS Nutrição">
  <meta name="theme-color" content="#EF7D0A">

  <!-- App instalável (Android/Chrome) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <!-- App instalável (iPhone/Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LPS Nutrição">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f5f7; overflow: hidden; }
    #app {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: 0; display: block;
      padding-top: env(safe-area-inset-top);
      box-sizing: border-box; background: #f4f5f7;
    }
    #carregar {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #ffffff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #EF7D0A; font-weight: 600; transition: opacity .3s;
    }
    #carregar img { width: 140px; height: 140px; }
    #carregar.escondido { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="carregar">
    <img src="icon-512.png" alt="LPS Nutrição">
    <div>A carregar...</div>
  </div>

  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbygya4m5ns6_aEDPr_qqupExiYNYIazc5-h8InqOk3MhOUp70G4lCLv-q07753RF64CXg/exec"
    title="LPS Nutrição"
    allow="clipboard-write; fullscreen"></iframe>

  <script>
    // Esconde o ecrã de carregamento quando a app abrir (ou ao fim de 8 s, por segurança)
    const esconder = () => document.getElementById('carregar').classList.add('escondido');
    document.getElementById('app').addEventListener('load', esconder);
    setTimeout(esconder, 8000);

    // Necessário para o Chrome oferecer "Instalar app"
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
